services:
  database:
    image: postgres:18
    env_file:
      - ./aspnetcore/.env
    ports: 
      - 5432:5432
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: ./aspnetcore
      dockerfile: Dockerfile
    ports:
    - 8080:8080
    env_file: 
      - ./aspnetcore/.env
    command: ["dotnet", "Web.dll"]
    depends_on:
      database:
        condition: service_healthy

